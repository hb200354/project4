<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가을 여행지 | GO-MONTH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>

<!-- 네비게이션 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">GO-MONTH</a>
    <ul class="navbar-nav mx-auto">
      <li class="nav-item"><a class="nav-link" href="spring.html">봄</a></li>
      <li class="nav-item"><a class="nav-link" href="summer.html">여름</a></li>
      <li class="nav-item"><a class="nav-link active" href="fall.html">가을</a></li>
      <li class="nav-item"><a class="nav-link" href="winter.html">겨울</a></li>
    </ul>
    <a class="btn btn-outline-light" href="login.html">로그인</a>
  </div>
</nav>

<!-- 헤더 -->
<header class="py-5 bg-light border-bottom text-center">
  <h1>가을에 떠나기 좋은 여행지</h1>
  <p>9월 · 10월 · 11월 단풍 여행 추천</p>
</header>

<!-- 월 버튼 -->
<section class="py-4">
  <div class="container d-flex gap-2">
    <button class="btn btn-dark btn-month" data-month="9">9월</button>
    <button class="btn btn-outline-dark btn-month" data-month="10">10월</button>
    <button class="btn btn-outline-dark btn-month" data-month="11">11월</button>
  </div>
</section>

<!-- 콘텐츠 -->
<div class="container">
  <div class="row">

    <!-- 메인 -->
    <div class="col-lg-8">

      <!-- 대표 카드 -->
      <div class="card mb-4">
        <img id="featuredImg" class="card-img-top" alt="대표 이미지">
        <div class="card-body">
          <div class="small text-muted">AUTUMN PICK</div>
          <h2 id="featuredTitle"></h2>
          <p id="featuredDesc"></p>

          <a id="featuredLink" class="btn btn-primary btn-sm mt-2">
            자세히 보기 →
          </a>
        </div>
      </div>

      <!-- 카드 목록 -->
      <div class="row" id="placeList"></div>
    </div>

    <!-- 사이드바 -->
    <div class="col-lg-4">

      <div class="card mb-4">
        <div class="card-header">여행지 검색</div>
        <div class="card-body">
          <input id="searchInput" class="form-control mb-2" placeholder="여행지 검색">
          <button id="searchBtn" class="btn btn-primary w-100">검색</button>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header">가을 여행 테마</div>
        <div class="card-body">
          <ul class="list-unstyled mb-0">
            <li>🍂 단풍 명소</li>
            <li>🥾 트레킹</li>
            <li>📸 감성 사진</li>
            <li>☕ 가을 카페</li>
          </ul>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header">가을 여행 한 줄 팁</div>
        <div class="card-body" id="tipBox"></div>
      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ======================
   가을 데이터
====================== */
const fallData = {
  9: {
    featured: {
      img: "assets/images/fall1.jpg",
      title: "담양 메타세쿼이아길",
      desc: "초가을 산책하기 좋은 단풍길"
    },
    tip: "9월은 선선해서 트레킹하기 좋아요 🍁",
    list: [
      { id: 1, title: "담양 메타세쿼이아길", img: "assets/images/fall1.jpg", desc: "가을 산책" },
      { id: 2, title: "강릉 안반데기", img: "assets/images/fall2.jpg", desc: "가을 감성" }
    ]
  },

  10: {
    featured: {
      img: "assets/images/fall-main.jpg",
      title: "내장산 국립공원",
      desc: "대한민국 단풍의 상징"
    },
    tip: "10월 말이 단풍 절정입니다 🍂",
    list: [
      { id: 3, title: "내장산 국립공원", img: "assets/images/fall-main.jpg", desc: "단풍 1위" },
      { id: 4, title: "설악산", img: "assets/images/fall3.jpg", desc: "가장 빠른 단풍" }
    ]
  },

  11: {
    featured: {
      img: "assets/images/fall4.jpg",
      title: "제주 오름",
      desc: "늦가을에 가장 좋은 힐링 코스"
    },
    tip: "11월은 한적한 여행이 좋아요 ☕",
    list: [
      { id: 5, title: "제주 오름", img: "assets/images/fall4.jpg", desc: "늦가을 힐링" },
      { id: 6, title: "강청산 군립공원", img: "assets/images/fall5.jpg", desc: "11월 초~중순 단풍 절정" }
    ]
  }
};

let currentMonth = 9;

const featuredImg   = document.getElementById("featuredImg");
const featuredTitle = document.getElementById("featuredTitle");
const featuredDesc  = document.getElementById("featuredDesc");
const featuredLink  = document.getElementById("featuredLink");
const placeList     = document.getElementById("placeList");
const searchInput   = document.getElementById("searchInput");
const searchBtn     = document.getElementById("searchBtn");
const tipBox        = document.getElementById("tipBox");

function renderMonth(month) {
  currentMonth = month;
  const data = fallData[month];

  featuredImg.src = data.featured.img;
  featuredTitle.innerText = data.featured.title;
  featuredDesc.innerText = data.featured.desc;
  tipBox.innerText = data.tip;

  featuredLink.href =
    "detail.html?title=" + encodeURIComponent(data.featured.title);

  renderList(data.list);
}

function renderList(list) {
  placeList.innerHTML = "";
  list.forEach(p => {
    placeList.innerHTML += `
      <div class="col-lg-6 mb-4">
        <div class="card h-100">
          <img src="${p.img}" class="card-img-top">
          <div class="card-body">
            <h5>${p.title}</h5>
            <p>${p.desc}</p>
            <a href="detail.html?id=${p.id}"
               class="btn btn-primary btn-sm">
              자세히 보기 →
            </a>
          </div>
        </div>
      </div>
    `;
  });
}

document.querySelectorAll(".btn-month").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".btn-month").forEach(b =>
      b.classList.replace("btn-dark", "btn-outline-dark")
    );
    btn.classList.replace("btn-outline-dark", "btn-dark");
    renderMonth(btn.dataset.month);
  };
});

searchBtn.onclick = () => {
  const keyword = searchInput.value.trim();
  const filtered = fallData[currentMonth].list.filter(p =>
    p.title.includes(keyword)
  );
  renderList(filtered);
};

renderMonth(9);
</script>

</body>
</html>
