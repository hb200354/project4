<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>여름 여행지 | GO-MONTH</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 페이지 CSS -->
  <link href="summer.css" rel="stylesheet">
</head>

<body>

<!-- =======================
 ① 네비게이션 바
======================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark position-relative">
  <div class="container">
    <a class="navbar-brand fw-bold" href="summer.html">GO-MONTH</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center"
         id="navbarSupportedContent">
      <ul class="navbar-nav position-lg-absolute start-50 translate-middle-x">
        <li class="nav-item"><a class="nav-link" href="spring.html">봄</a></li>
        <li class="nav-item"><a class="nav-link active" href="summer.html">여름</a></li>
        <li class="nav-item"><a class="nav-link" href="fall.html">가을</a></li>
        <li class="nav-item"><a class="nav-link" href="winter.html">겨울</a></li>
      </ul>
    </div>

    <div class="d-none d-lg-block">
      <a class="btn btn-outline-light btn-login" href="login.html">로그인</a>
    </div>
  </div>
</nav>

<!-- =======================
 ② 페이지 헤더
======================= -->
<header class="py-5 bg-light border-bottom mb-4">
  <div class="container text-center my-5">
    <h1 class="fw-bolder">여름에 떠나기 좋은 여행지</h1>
    <p class="lead mb-0">
      바다와 자연으로 떠나는 시원한 여름 여행 (6~8월)
    </p>
  </div>
</header>

<!-- =======================
 ③ 월별 버튼
======================= -->
<section class="py-4">
  <div class="container d-flex gap-2">
    <button class="btn btn-dark btn-month" data-month="6">6월</button>
    <button class="btn btn-outline-dark btn-month" data-month="7">7월</button>
    <button class="btn btn-outline-dark btn-month" data-month="8">8월</button>
  </div>
</section>

<!-- =======================
 ④ 페이지 콘텐츠
======================= -->
<div class="container">
  <div class="row">

    <!-- 메인 -->
    <div class="col-lg-8">

      <!-- 카드 목록 -->
      <div class="row" id="placeList"></div>

      <!-- 페이지네이션 (더미) -->
      <nav aria-label="Pagination">
        <hr class="my-0" />
        <ul class="pagination justify-content-center my-4">
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">3</a></li>
        </ul>
      </nav>

    </div>

    <!-- 사이드바 -->
    <div class="col-lg-4">

      <!-- 검색 -->
      <div class="card mb-4">
        <div class="card-header">여행지 검색</div>
        <div class="card-body">
          <div class="input-group">
            <input id="searchInput" class="form-control" type="text" placeholder="여행지 검색">
            <button class="btn btn-primary" id="searchBtn">검색</button>
          </div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header">여름 여행 테마</div>
        <div class="card-body">
          <ul class="list-unstyled mb-0">
            <li>🏖 바다 여행</li>
            <li>🌊 계곡 · 폭포</li>
            <li>🌙 여름 밤 여행</li>
            <li>🌿 힐링 · 휴양</li>
          </ul>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header">여름 여행 한 줄 팁</div>
        <div class="card-body">
          햇빛이 강한 낮보다는<br>
          아침이나 저녁 시간을 활용하면
          더 시원하게 여행할 수 있어요 ☀️
        </div>
      </div>

    </div>
  </div>
</div>

<!-- =======================
 ⑤ 푸터
======================= -->
<footer class="py-5 bg-dark">
  <div class="container">
    <p class="m-0 text-center text-white">
      Copyright © GO-MONTH 2025
    </p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  /* ======================
     데이터
  ====================== */
  const monthData = {
    6: [
      { id: "gangneung", title: "강릉 경포대", img: "imgs/summer-main.jpg", desc: "6월 추천 여름 여행지" },
      { id: "haeundae", title: "부산 해운대", img: "imgs/summer1.jpg", desc: "6월 바다 여행 명소" }
    ],
    7: [
      { id: "heungjeong", title: "평창 흥정계곡", img: "imgs/summer2.jpg", desc: "7월 시원한 계곡 여행" },
      { id: "hyupjae", title: "제주 협재해변", img: "imgs/summer3.jpg", desc: "7월 제주 바다 여행" }
    ],
    8: [
      { id: "hangang", title: "한강 야경", img: "imgs/summer4.jpg", desc: "8월 여름밤 산책" },
      { id: "haeundae", title: "부산 해운대", img: "imgs/summer1.jpg", desc: "8월 늦여름 바다" }
    ]
  };

  const allPlaces = [
    ...monthData[6],
    ...monthData[7],
    ...monthData[8]
  ];

  const placeList = document.getElementById("placeList");
  const buttons = document.querySelectorAll(".btn-month");
  const searchInput = document.getElementById("searchInput");
  const searchBtn = document.getElementById("searchBtn");

  /* ======================
     렌더링 함수
  ====================== */
  function renderList(list) {
    placeList.innerHTML = "";

    if (list.length === 0) {
      placeList.innerHTML = `
        <div class="col-12 text-center py-5">
          <p class="text-muted">검색 결과가 없습니다.</p>
        </div>
      `;
      return;
    }

    list.forEach(place => {
      placeList.innerHTML += `
        <div class="col-lg-6 mb-4">
          <div class="card h-100">
            <img src="${place.img}" class="card-img-top">
            <div class="card-body">
              <h5 class="card-title">${place.title}</h5>
              <p class="card-text">${place.desc}</p>
              <a href="detail.html?id=${place.id}" class="btn btn-primary">
                자세히 보기 →
              </a>
            </div>
          </div>
        </div>
      `;
    });
  }

  function renderMonth(month) {
    renderList(monthData[month]);
  }

  /* ======================
     월별 버튼
  ====================== */
  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      buttons.forEach(b => {
        b.classList.remove("btn-dark");
        b.classList.add("btn-outline-dark");
      });
      btn.classList.remove("btn-outline-dark");
      btn.classList.add("btn-dark");

      renderMonth(btn.dataset.month);
    });
  });

  /* ======================
     검색 기능
  ====================== */
  searchBtn.addEventListener("click", () => {
    const keyword = searchInput.value.trim();

    if (!keyword) {
      alert("검색어를 입력해주세요!");
      return;
    }

    const result = allPlaces.filter(place =>
      place.title.includes(keyword)
    );

    renderList(result);
  });

  searchInput.addEventListener("keyup", (e) => {
    if (e.key === "Enter") {
      searchBtn.click();
    }
  });

  // 초기 화면 (6월)
  renderMonth(6);
</script>

</body>
</html>
