<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>여름 여행지 | GO-MONTH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>

<!-- 네비게이션 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">GO-MONTH</a>
    <ul class="navbar-nav mx-auto">
      <li class="nav-item"><a class="nav-link" href="spring.html">봄</a></li>
      <li class="nav-item"><a class="nav-link active" href="summer.html">여름</a></li>
      <li class="nav-item"><a class="nav-link" href="fall.html">가을</a></li>
      <li class="nav-item"><a class="nav-link" href="winter.html">겨울</a></li>
    </ul>
    <a class="btn btn-outline-light" href="login.html">로그인</a>
  </div>
</nav>

<!-- 헤더 -->
<header class="py-5 bg-light border-bottom text-center">
  <h1>여름에 떠나기 좋은 여행지</h1>
  <p>6월 · 7월 · 8월 여름 여행 추천</p>
</header>

<!-- 월 버튼 -->
<section class="py-4">
  <div class="container d-flex gap-2">
    <button class="btn btn-dark btn-month" data-month="6">6월</button>
    <button class="btn btn-outline-dark btn-month" data-month="7">7월</button>
    <button class="btn btn-outline-dark btn-month" data-month="8">8월</button>
  </div>
</section>

<!-- 콘텐츠 -->
<div class="container">
  <div class="row">

    <!-- 메인 -->
    <div class="col-lg-8">

      <!-- 대표 카드 -->
      <div class="card mb-4">
        <img id="featuredImg" class="card-img-top" alt="대표 이미지">
        <div class="card-body">
          <div class="small text-muted">SUMMER PICK</div>
          <h2 id="featuredTitle"></h2>
          <p id="featuredDesc"></p>
          <a id="featuredLink" class="btn btn-primary btn-sm mt-2">자세히 보기 →</a>
        </div>
      </div>

      <!-- 카드 목록 -->
      <div class="row" id="placeList"></div>
    </div>

    <!-- 사이드바 -->
    <div class="col-lg-4">

      <div class="card mb-4">
        <div class="card-header">여행지 검색</div>
        <div class="card-body">
          <input id="searchInput" class="form-control mb-2" placeholder="여행지 검색">
          <button id="searchBtn" class="btn btn-primary w-100">검색</button>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header">여름 여행 테마</div>
        <div class="card-body">
          <ul class="list-unstyled mb-0">
            <li>🏖 바다 여행</li>
            <li>🌊 계곡 · 폭포</li>
            <li>🌙 여름 밤 여행</li>
            <li>🌿 힐링 · 휴양</li>
          </ul>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header">여름 여행 한 줄 팁</div>
        <div class="card-body" id="tipBox"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const summerData = {
  6: {
    featured: {
      img: "assets/images/summer-main.jpg",
      title: "강릉 경포대",
      desc: "초여름에 가장 잘 어울리는 바다 여행지"
    },
    tip: "6월은 습도가 낮아 여행하기 쾌적한 시기입니다 ☀️",
    list: [
      { id: 1, title: "부산 해운대", img: "assets/images/summer1.jpg", desc: "여름 대표 해변" },
      { id: 2, title: "평창 흥정계곡", img: "assets/images/summer2.jpg", desc: "시원한 계곡" },
      { id: 3, title: "제주 협재해변", img: "assets/images/summer4.jpg", desc: "에메랄드빛 바다" },
      { id: 4, title: "한강 야경", img: "assets/images/summer4.jpg", desc: "밤 산책" }
    ]
  },

  7: {
    featured: {
      img: "최수진/Imgs/July1.jpg",
      title: "포천 허브아일랜드",
      desc: "여름 밤이 더 아름다운 베네치아존"
    },
    tip: "7월에는 밤 여행 코스를 추천해요 🌙",
    list: [
      { id: 1, title: "대전 상소동 산림욕장", img: "최수진/Imgs/July1.jpg", desc: "한여름 바다 풍경" },
      { id: 2, title: "평창 육백마지기", img: "최수진/Imgs/July2.jpg", desc: "푸른 바다와 절벽" },
      { id: 3, title: "울릉도", img: "최수진/Imgs/July3.jpg", desc: "자연 속 힐링" },
      { id: 4, title: " 양양 하조대해수욕장 & 전망대", img: "최수진/Imgs/July4.jpg", desc: "탁 트인 풍경" },
     
    ]
  },

  8: {
    featured: {
      img: "최수진/Imgs/August1.jpg",
      title: "파주 퍼스트가든",
      desc: "늦여름에 즐기는 정원 산책"
    },
    tip: "8월은 조용한 힐링 여행이 좋아요 🍃",
    list: [
      { id: 1, title: "가평 피노키오와 다빈치", img: "최수진/Imgs/August1.jpg", desc: "여름 꽃 가득" },
      { id: 2, title: "삼척 장호항", img: "최수진/Imgs/August2.jpg", desc: "자연 산책" },
      { id: 3, title: "아침고요수목원 (경기도 가평)", img: "최수진/Imgs/August3.jpg", desc: "동화 같은 풍경" },
      { id: 4, title: "태백 해바라기축제 (강원도 태백)", img: "최수진/Imgs/August4.jpg", desc: "고요한 공간" },
     
    ]
  }
};

let currentMonth = 6;

const featuredImg = document.getElementById("featuredImg");
const featuredTitle = document.getElementById("featuredTitle");
const featuredDesc = document.getElementById("featuredDesc");
const featuredLink = document.getElementById("featuredLink");
const placeList = document.getElementById("placeList");
const tipBox = document.getElementById("tipBox");

function renderMonth(month) {
  currentMonth = month;
  const data = summerData[month];

  featuredImg.src = data.featured.img;
  featuredTitle.innerText = data.featured.title;
  featuredDesc.innerText = data.featured.desc;
  tipBox.innerText = data.tip;

  renderList(data.list);
}

function renderList(list) {
  placeList.innerHTML = "";
  list.forEach(p => {
    placeList.innerHTML += `
      <div class="col-lg-6 mb-4">
        <div class="card h-100">
          <img src="${p.img}" class="card-img-top">
          <div class="card-body">
            <h5>${p.title}</h5>
            <p>${p.desc}</p>
            <a href="#" class="btn btn-primary btn-sm">자세히 보기 →</a>
          </div>
        </div>
      </div>
    `;
  });
}

document.querySelectorAll(".btn-month").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".btn-month").forEach(b =>
      b.classList.replace("btn-dark", "btn-outline-dark")
    );
    btn.classList.replace("btn-outline-dark", "btn-dark");
    renderMonth(btn.dataset.month);
  };
});

renderMonth(6);
</script>

</body>
</html>
