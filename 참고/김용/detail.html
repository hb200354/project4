<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>여행지 상세 | GO-MONTH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>

<!-- 네비게이션 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">GO-MONTH</a>
    <ul class="navbar-nav mx-auto">
      <li class="nav-item"><a class="nav-link" href="spring.html">봄</a></li>
      <li class="nav-item"><a class="nav-link active" href="summer.html">여름</a></li>
      <li class="nav-item"><a class="nav-link" href="fall.html">가을</a></li>
      <li class="nav-item"><a class="nav-link" href="winter.html">겨울</a></li>
    </ul>
    <a class="btn btn-outline-light" href="login.html">로그인</a>
  </div>
</nav>

<!-- 헤더 -->
<header class="py-4 bg-light border-bottom">
  <div class="container">
    <h1 id="detailTitle"></h1>
    <p class="text-muted" id="detailSubtitle"></p>
  </div>
</header>

<!-- 상세 콘텐츠 -->
<div class="container my-5">
  <div class="row">

    <!-- 이미지 -->
    <div class="col-lg-7 mb-4">
      <img id="detailImg" class="img-fluid rounded shadow-sm" alt="여행지 이미지">
    </div>

    <!-- 설명 -->
    <div class="col-lg-5">
      <h4>여행지 소개</h4>
      <p id="detailDesc" class="mt-3"></p>

      <hr>

      <h5>이런 분께 추천해요</h5>
      <ul id="detailTags">
        <li>여름 여행</li>
        <li>힐링</li>
        <li>사진 명소</li>
      </ul>

      <a href="summer.html" class="btn btn-outline-primary mt-3">← 여름 여행지로 돌아가기</a>
    </div>

  </div>
</div>

<script>
/* 🔹 상세 데이터 (여름 공통) */
const detailData = {
  1: {
    title: "부산 해운대",
    subtitle: "대한민국 대표 여름 해변",
    img: "assets/images/summer1.jpg",
    desc: "부산 해운대는 여름이면 가장 많은 사람들이 찾는 대표적인 해변입니다. 넓은 백사장과 다양한 먹거리, 밤에는 화려한 야경까지 즐길 수 있어요."
  },
  2: {
    title: "평창 흥정계곡",
    subtitle: "자연 속에서 즐기는 시원한 여름",
    img: "assets/images/summer2.jpg",
    desc: "맑은 물과 울창한 숲이 어우러진 흥정계곡은 한여름에도 시원한 힐링 여행지입니다. 가족 단위 여행객에게 특히 추천해요."
  },
  3: {
    title: "제주 협재해변",
    subtitle: "에메랄드빛 바다",
    img: "assets/images/summer3.jpg",
    desc: "협재해변은 투명한 바다색과 고운 모래가 인상적인 제주 대표 해변입니다. 한적한 분위기에서 여유로운 시간을 보내기 좋아요."
  },
  4: {
    title: "한강 야경",
    subtitle: "여름 밤 산책 명소",
    img: "assets/images/summer4.jpg",
    desc: "여름밤 시원한 바람을 맞으며 즐기는 한강 산책은 도심 속 최고의 힐링 코스입니다."
  },

  /* 대표 카드용 */
  100: {
    title: "강릉 경포대",
    subtitle: "초여름 바다 여행의 정석",
    img: "assets/images/summer-main.jpg",
    desc: "강릉 경포대는 푸른 바다와 호수가 어우러진 여름 대표 여행지로, 초여름에 특히 아름다운 풍경을 자랑합니다."
  },
  200: {
    title: "포천 허브아일랜드",
    subtitle: "여름 밤이 아름다운 여행지",
    img: "최수진/Imgs/July1.jpg",
    desc: "포천 허브아일랜드는 밤이 되면 조명으로 더욱 아름다워지는 명소로, 여름 밤 데이트 코스로 인기가 많습니다."
  },
  300: {
    title: "파주 퍼스트가든",
    subtitle: "늦여름 힐링 산책",
    img: "최수진/Imgs/August1.jpg",
    desc: "퍼스트가든은 정원과 산책로가 잘 조성된 공간으로, 성수기를 지난 늦여름에 여유롭게 즐기기 좋습니다."
  }
};

/* 🔹 URL 파라미터 id 가져오기 */
const params = new URLSearchParams(location.search);
const id = params.get("id");

/* 🔹 데이터 렌더링 */
const data = detailData[id];

if (data) {
  document.getElementById("detailTitle").innerText = data.title;
  document.getElementById("detailSubtitle").innerText = data.subtitle;
  document.getElementById("detailImg").src = data.img;
  document.getElementById("detailDesc").innerText = data.desc;
} else {
  document.getElementById("detailTitle").innerText = "여행지 정보를 찾을 수 없습니다.";
}
</script>

</body>
</html>
