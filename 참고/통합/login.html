<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>로그인 | GO-MONTH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 공통 CSS -->
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>

  <!-- =======================
 네비게이션
======================= -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark position-relative">
    <div class="container">

      <a class="navbar-brand fw-bold" href="index.html">GO-MONTH</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
        <ul class="navbar-nav position-lg-absolute start-50 translate-middle-x">
          <li class="nav-item"><a class="nav-link" href="spring.html">봄</a></li>
          <li class="nav-item"><a class="nav-link" href="summer.html">여름</a></li>
          <li class="nav-item"><a class="nav-link" href="fall.html">가을</a></li>
          <li class="nav-item"><a class="nav-link" href="winter.html">겨울</a></li>
        </ul>
      </div>

      <div class="d-none d-lg-block">
        <a class="btn btn-outline-light btn-login active" href="login.html">로그인</a>
      </div>

    </div>
  </nav>

  <!-- =======================
 로그인 영역
======================= -->
  <section class="py-5 d-flex align-items-center login-section">
    <div class="container">
      <div class="row justify-content-center">

        <div class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-5">

              <h2 class="text-center mb-4">로그인</h2>

              <!-- 로그인 폼 -->
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">아이디 *</label>
                  <input type="text" id="userId" class="form-control" placeholder="아이디 입력" required>
                </div>

                <div class="mb-4">
                  <label class="form-label">비밀번호 *</label>
                  <input type="password" class="form-control" placeholder="비밀번호 입력" required>
                </div>

                <div class="d-grid mb-3">
                  <button class="btn btn-primary btn-lg">로그인</button>
                </div>
              </form>

              <div class="text-center">
                <a href="join.html">아직 회원이 아니신가요? → 회원가입</a>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- =======================
 푸터
======================= -->
  <footer class="py-5 bg-dark">
    <div class="container">
      <p class="m-0 text-center text-white">
        Copyright © GO-MONTH 2025
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- =======================
 로그인 처리 JS (프론트용)
======================= -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const userId = document.getElementById("userId").value.trim();

      // 로그인 상태 저장 (프론트 더미)
      localStorage.setItem("loginUser", userId);

      alert(userId + "님 로그인되었습니다 ✅");

      // 메인으로 이동
      location.href = "index.html";
    });
  </script>

</body>

</html>
