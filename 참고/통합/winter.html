<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>겨울 여행지 | GO-MONTH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 공통 CSS -->
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>

  <!-- =======================
 네비게이션
======================= -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark position-relative">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">GO-MONTH</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
        <ul class="navbar-nav position-lg-absolute start-50 translate-middle-x">
          <li class="nav-item"><a class="nav-link" href="spring.html">봄</a></li>
          <li class="nav-item"><a class="nav-link" href="summer.html">여름</a></li>
          <li class="nav-item"><a class="nav-link" href="fall.html">가을</a></li>
          <li class="nav-item"><a class="nav-link active" href="winter.html">겨울</a></li>
        </ul>
      </div>

      <div class="d-none d-lg-block">
        <a class="btn btn-outline-light btn-login" href="login.html">로그인</a>
      </div>
    </div>
  </nav>

  <!-- =======================
 헤더
======================= -->
  <header class="py-5 bg-light border-bottom mb-4 text-center">
    <h1 class="fw-bolder">겨울에 떠나기 좋은 여행지</h1>
    <p class="lead mb-0">12월 · 1월 · 2월 눈꽃 여행 추천</p>
  </header>

  <!-- =======================
 월 버튼
======================= -->
  <section class="py-4">
    <div class="container d-flex gap-2">
      <button class="btn btn-dark btn-month" data-month="12">12월</button>
      <button class="btn btn-outline-dark btn-month" data-month="1">1월</button>
      <button class="btn btn-outline-dark btn-month" data-month="2">2월</button>
    </div>
  </section>

  <!-- =======================
 콘텐츠
======================= -->
  <div class="container">
    <div class="row">

      <!-- 메인 -->
      <div class="col-lg-8">

        <!-- 대표 카드 -->
        <div class="card mb-4">
          <img id="featuredImg" class="card-img-top featured-img">
          <div class="card-body">
            <div class="small text-muted">WINTER PICK</div>
            <h2 id="featuredTitle"></h2>
            <p id="featuredDesc"></p>
            <a id="featuredLink" class="btn btn-primary btn-sm">자세히 보기 →</a>
          </div>
        </div>

        <!-- 카드 목록 -->
        <div class="row" id="placeList"></div>
      </div>

      <!-- 사이드 -->
      <div class="col-lg-4">

        <div class="card mb-4">
          <div class="card-header">여행지 검색</div>
          <div class="card-body">
            <input id="searchInput" class="form-control mb-2" placeholder="여행지 검색">
            <button id="searchBtn" class="btn btn-primary w-100">검색</button>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-header">겨울 여행 테마</div>
          <div class="card-body">
            <ul class="list-unstyled mb-0">
              <li>❄️ 눈꽃 여행</li>
              <li>♨️ 온천</li>
              <li>🎿 스키</li>
              <li>🏔 설경</li>
            </ul>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-header">겨울 여행 한 줄 팁</div>
          <div class="card-body" id="tipBox"></div>
        </div>

      </div>
    </div>
  </div>

  <footer class="py-5 bg-dark">
    <div class="container">
      <p class="m-0 text-center text-white">Copyright © GO-MONTH 2025</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/winter.js"></script>
</body>

</html>
