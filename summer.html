<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>여름 페이지</title>
    <link rel="stylesheet" href="css/summer.css">
</head>
<body>

    <!-- ===== 전체 래퍼 ===== -->
    <div class="summer-wrap">

        <!-- ===== 상단 영역 ===== -->
        <header class="summer-header">
            <h1>여름 페이지</h1>
            <p>여름 페이지 설명 영역</p>
        </header>

        <!-- ===== 메인 콘텐츠 ===== -->
        <main class="summer-content">

            <!-- 카드 리스트 영역 -->
            <section class="place-list">

                <div class="place-card">
                    <div class="img-box"></div>

                    <div class="text-box">
                        <h3>제목 영역</h3>
                        <p>내용 영역</p>
                    </div>
                </div>

            </section>

        </main>

    </div>

    <script src="js/summer.js"></script>
</body>
</html>
